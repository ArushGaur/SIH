<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Intelligence Platform - Fleet Sensing Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Newsreader:wght@500;600&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="app">
        <header>
            <div class="brand">
                <div class="mark">UI</div>
                <h1>Urban Intelligence Platform</h1>
            </div>
            <div class="status-pills">
                <div class="pill"><span class="dot pulse"></span>Live database feed</div>
                <div class="pill" id="clockPill">--:--:--</div>
                <div class="theme-toggle" id="themeToggle">
                    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"></svg>
                    <span id="themeLabel">Dark</span>
                </div>
            </div>
        </header>

        <aside>
            <h2>Event Filters</h2>
            <div class="filter-group" id="filterList"></div>

            <div class="divider"></div>
            <h2>Layers</h2>
            <div class="toggle-row">
                <span>Event density heatmap</span>
                <div class="switch on" id="heatToggle"></div>
            </div>

            <div class="divider"></div>
            <h2>Fleet Snapshot</h2>
            <div class="stat-row"><span>Buses reporting</span><b id="busesReporting">-- / --</b></div>
            <div class="stat-row"><span>Active events</span><b id="totalEvents">--</b></div>
            <div class="stat-row"><span>High severity</span><b style="color:#ef4444">--</b></div>
            <div class="stat-row"><span>Avg confidence</span><b>--</b></div>
        </aside>

        <div class="drawer-handle" id="drawerHandle" title="Toggle filters panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6" />
            </svg>
        </div>

        <main>
            <div id="map"></div>
            <div class="fleet-badge">
                <div class="fh">Active alerts</div>
                <div class="fv" id="activeAlerts">--<span>▲ live</span></div>
            </div>
        </main>
    </div>

    <div id="lightbox" class="lightbox-overlay" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Full-size detection frame">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <script src="app.js"></script>
</body>

</html>
